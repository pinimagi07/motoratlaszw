<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motor Atlas — Feedback Inbox</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><style>body{background:#050807;color:#f5f7f5;margin:0;font-family:'DM Sans',Arial,sans-serif}.admin{max-width:1100px;margin:auto;padding:32px 5vw 70px}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #26312a;padding-bottom:18px;margin-bottom:22px}.admin h1{margin:0;font-size:clamp(2rem,5vw,3.5rem)}.admin h1 span{color:#b7ff48}.admin small{color:#8e9992}.login,.box{background:#0b100e;border:1px solid #2c3931;border-radius:12px;padding:18px;margin-bottom:18px}.login{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.login input{min-width:260px;flex:1;background:#101612;color:white;border:1px solid #344139;border-radius:8px;padding:12px}.admin button{min-height:42px;padding:0 14px;border:1px solid #39463e;border-radius:8px;background:#121914;color:#eef2ef}.admin button.primary{background:#b7ff48;color:#071006;border-color:#b7ff48;font-weight:700}.feedback-list{display:grid;gap:12px}.feedback-item{border:1px solid #2c3931;border-radius:10px;padding:15px;background:#0a0f0c}.feedback-item.pending{border-left:3px solid #b7ff48}.feedback-item .meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:#849087;font-size:.75rem;margin-bottom:9px}.feedback-item h3{margin:0 0 6px;font-size:1rem}.feedback-item p{white-space:pre-wrap;line-height:1.6;color:#c4ccc6}.actions{display:flex;gap:8px;flex-wrap:wrap}.ratings{width:100%;border-collapse:collapse}.ratings th,.ratings td{text-align:left;padding:10px;border-bottom:1px solid #243029}.ratings th{color:#b7ff48}.status{color:#95a099}.error{color:#ff9c9c}@media(max-width:650px){.admin-head{align-items:start;flex-direction:column}.ratings{font-size:.8rem}}</style></head><body><main class="admin"><div class="admin-head"><div><small>PRIVATE OWNER VIEW</small><h1>Feedback <span>Inbox</span></h1></div><a href="./">← Back to Motor Atlas</a></div><section class="login"><input id="adminToken" type="password" placeholder="Enter admin token" autocomplete="current-password"><button id="loadInbox" class="primary">Open inbox</button><span id="adminStatus" class="status"></span></section><section class="box"><h2>Visitor feedback</h2><div id="feedbackList" class="feedback-list"><p class="status">Enter your admin token to load comments.</p></div></section><section class="box"><h2>Community ratings</h2><div style="overflow:auto"><table class="ratings"><thead><tr><th>Car ID</th><th>Average</th><th>Ratings</th></tr></thead><tbody id="ratingsBody"><tr><td colspan="3" class="status">No data loaded.</td></tr></tbody></table></div></section></main><script src="feedback-admin.js"></script></body></html>
