name: Vendor original Motor Atlas assets

on:
  push:
    paths:
      - '.github/workflows/vendor-original.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original published Motor Atlas files
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://motor-atlas-zw.pmagstar.chatgpt.site'
          mkdir -p assets

          files=(
            style.css
            views.css
            data.js
            mercedes-data.js
            pickups-data.js
            views-data.js
            app.js
            jdm-data.js
            jdm.js
            favicon.svg
          )

          assets=(
            photo-sources.json
            ranger.jpg
            xtrail.jpg
            serena.jpg
            swift.jpg
            markii.jpg
            markx.jpg
            crv.jpg
            cx5.jpg
            yaris.jpg
            dmax.jpg
            jazz.jpg
            corolla.jpg
            jimny.jpg
            rav4.jpg
            night-road.jpg
            funcargo.jpg
            hilux.jpg
          )

          for f in "${files[@]}"; do
            curl --fail --location --retry 3 --silent --show-error "$BASE/$f" -o "$f"
          done

          for f in "${assets[@]}"; do
            curl --fail --location --retry 3 --silent --show-error "$BASE/assets/$f" -o "assets/$f"
          done

      - name: Commit vendored source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css views.css data.js mercedes-data.js pickups-data.js views-data.js app.js jdm-data.js jdm.js favicon.svg assets/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Vendor original Motor Atlas published source files'
            git push origin HEAD:main
          fi
